[project]
name = "executor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "easyocr>=1.7.2",
    "einops==0.8.0",
    "graphviz>=0.21",
    "huggingface-hub>=0.23.2,<1.0",
    "numpy==1.26.4",
    "onnxruntime>=1.30.0",
    "opencv-python==4.10.0.84",
    "orjson>=3.13.0",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "pyautogui==0.9.54",
    "pynput>=1.8.2",
    "pywinauto>=0.6.9",
    "rapidocr>=3.9.2",
    "supervision==0.18.0",
    "timm>=1.0.29",
    "tokenizers>=0.20,<0.21",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers==4.46.3",
    "uiautomation>=2.0.29",
]

[dependency-groups]
dev = [
    "rapidfuzz>=3.14.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
